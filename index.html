/* ---------- weekly review ---------- */
function weekReview(mon) {
  const days = Array.from({ length: 7 }, (_, k) => addDays(mon, k)), prevMon = addDays(mon, -7);
  const ws = weekStats(mon);
  const rds = days.map(d => S.readiness[d]).filter(Boolean);
  const lv = { green: 0, yellow: 0, red: 0 }; rds.forEach(r => lv[r.override ? r.override.level : r.result]++);
  const inWk = (arr, f) => arr.filter(x => f(x.date));
  const wIn = sortedWeights().filter(w => w.date >= mon && w.date <= days[6]);
  const wPrev = sortedWeights().filter(w => w.date >= prevMon && w.date < mon);
  const pDays = days.filter(d => (S.protein[d] || []).length);
  const pAvg = avg(pDays.map(proteinTotal));
  const jIn = sortedJumps().filter(j => j.date >= mon && j.date <= days[6]);
  const jBefore = sortedJumps().filter(j => j.date < mon);
  const eIn = days.map(d => S.elbow[d]).filter(x => x && x.daily != null);
  const ePrev = Array.from({ length: 7 }, (_, k) => S.elbow[addDays(prevMon, k)]).filter(x => x && x.daily != null);
  const rehabN = days.reduce((a, d) => a + rehabCount(d), 0);
  const recs = [];
  const enough = rds.length >= 3;
  if (ws.done < 3) recs.push('Consistency first: completion was low — repeat this week\'s plan rather than progressing.');
  if (enough && (lv.red >= 2 || avg(rds.map(r => r.soreness)) >= 5)) recs.push('Recovery looked limited (several red days or high soreness). Hold or reduce training load next week; prioritise sleep.');
  if (eIn.length >= 3 && ePrev.length >= 3 && avg(eIn.map(x => x.daily)) - avg(ePrev.map(x => x.daily)) >= 1) recs.push('Elbow pain rose versus last week — keep upper-body loads light and mention it to your physiotherapist if it persists.');
  if (eIn.some(x => x.newSymptoms)) recs.push('New weakness/numbness/loss of function was recorded — arrange a reassessment before loading the elbow further.');
  if (rehabN < 14) recs.push(`Prescribed elbow exercises were done ${rehabN}/28 times — try anchoring them to a daily habit (e.g. after brushing teeth).`);
  if (pDays.length >= 3 && pAvg < S.profile.proteinGoal * 0.85) recs.push(`Protein averaged ${Math.round(pAvg)} g on logged days — below your ${S.profile.proteinGoal} g target. Add a protein source to one more meal.`);
  if (wIn.length && wPrev.length) { const ch = avg(wIn.map(w => w.lb)) - avg(wPrev.map(w => w.lb)); if (ch < -2.5) recs.push('Weight dropped quickly this week — consider eating a little more to protect performance and recovery.'); }
  if (!recs.length && enough && ws.done >= 4) recs.push('Solid week. If the progression check agrees, consider moving to the next program week.');
  if (!enough) recs.push('Not enough readiness data this week to judge recovery — check in daily for better recommendations.');
  return { days, ws, rds, lv, wIn, wPrev, pDays, pAvg, jIn, jBefore, eIn, ePrev, rehabN, recs };
}
function pReview() {

  const R = weekReview(mon);

    <div class="kv"><span>Avg daily protein</span><b>${R.pAvg != null ? `${Math.round(R.pAvg)} g (${R.pDays.length} day${R.pDays.length === 1 ? '' : 's'} logged)` : 'not logged'}</b></div>
    <div class="kv"><span>Vertical jump</span><b>${R.jIn.length ? (() => { const j = R.jIn[R.jIn.length - 1], p = R.jBefore[R.jBefore.length - 1]; return `appr ${j.approach ?? '—'} in${p && p.approach != null && j.approach != null ? ` (${j.approach - p.approach >= 0 ? '+' : ''}${r1(j.approach - p.approach)})` : ''}`; })() : 'not measured'}</b></div>
    <div class="kv"><span>Elbow pain (daily avg)</span><b>${R.eIn.length ? `${r1(avg(R.eIn.map(x => x.daily)))}/10${R.ePrev.length ? ` vs ${r1(avg(R.ePrev.map(x => x.daily)))} prev` : ''}` : 'not logged'}</b></div>
    <div class="kv"><span>Prescribed rehab done</span><b>${R.rehabN}/28</b></div></div>`;
  h += secTitle('Recommendations for next week') + `<div class="card"><ul class="bul">${R.recs.map(r => `<li>${r}</li>`).join('')}</ul><p class="small muted">Rule-based suggestions from what you logged — not predictions or medical advice.</p><button class="btn primary block" data-act="progCheck">Open progression check</button></div>`;
  return h;
}

    if (!await ask(`Restore backup from ${data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown date'}?\n\nThis REPLACES all current HoopLab data on this device${nPh ? ` and its photos (${nPh} photo${nPh === 1 ? '' : 's'} in backup)` : ' (photos on this device are kept, since the backup has none)'}.`)) { el.value = ''; return; }
    S = migrate(data.state); save();
    if (nPh) { await PhotoDB.clear(); photoURLs.clear(); for (const p of data.photos) { const { dataURL, ...meta } = p; await PhotoDB.put(Object.assign(meta, { data: await dataURLToBuf(dataURL) })); } }
    applyTheme(); closeSheet(); render(); toast('Backup restored');
  } catch (e) { toast('Restore failed: ' + e.message); }
  el.value = '';
};
ACT.copyBackup = async () => {
  const txt = JSON.stringify({ app: 'HoopLab', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), state: S, photos: [] });
  try { await navigator.clipboard.writeText(txt); S.profile.lastBackup = today(); save(); toast('Backup copied — paste it into a note or file and save it as .json'); }
  catch (e) { openSheet('Backup text', () => `<p class="small muted">Copying was blocked. Select all of this text, copy it and save it as a .json file.</p><textarea id="bkTxt" style="min-height:240px;font-size:12px" readonly>${esc(txt)}</textarea>`, { onMount: b => { const t = $('#bkTxt', b); t.focus(); t.select(); } }); }
};
ACT.resetAll = async () => {
  if (!await ask('Erase ALL HoopLab data and photos on this device? Export a backup first if you might need it.')) return;
  if (!await ask('Are you sure? This cannot be undone.')) return;
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem('hooplab.apiKey'); } catch (e) { } try { await PhotoDB.clear(); } catch (e) { }
  photoURLs.clear(); S = defaultState(); save(); closeSheet(); render(); toast('All data erased');
};
function applyTheme() {
  const t = S.profile.theme;
  const dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = $('meta[name="theme-color"]'); if (m) m.content = dark ? '#0a0c10' : '#f3f5f8';
}

/* ---------- boot ---------- */
function boot() {
  loadState(); applyTheme();
  $('#brandLogo').innerHTML = IC.logo;
  $('#setBtn').innerHTML = IC.gear;
  $('#sheetClose').innerHTML = IC.x;
  $('#tReset').innerHTML = IC.reset; $('#tClose').innerHTML = IC.x;
  render();
  window.addEventListener('scroll', () => $('.topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  $('#scrim').addEventListener('click', closeSheet);
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.profile.theme === 'system' && applyTheme());
  // day rollover while app is open
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); ui.trainDate = lastDay; ui.fuelDate = lastDay; if (!SHEET) render(true); } }, 60000);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
