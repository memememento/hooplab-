<style>
:root{
  --bg:#0a0c10;--surface:#13171e;--surface2:#1a1f28;--surface3:#232a35;--border:#262d39;
  --text:#eef1f6;--muted:#97a1b2;--faint:#5f6878;
  --acc:#ff7a1a;--acc-soft:rgba(255,122,26,.14);--acc2:#5aa9ff;
  --green:#34d399;--green-soft:rgba(52,211,153,.14);--yellow:#fbbf24;--yellow-soft:rgba(251,191,36,.14);--red:#f87171;--red-soft:rgba(248,113,113,.14);
  --fig:#e6eaf1;--fig2:#7c8698;--eq:#3b4556;--eq2:#566173;
  --r:16px;--nav-h:64px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;--surface:#ffffff;--surface2:#f0f2f6;--surface3:#e4e8ef;--border:#dde2ea;
  --text:#111827;--muted:#5b6474;--faint:#9aa3b2;--acc:#e8620a;--acc-soft:rgba(232,98,10,.1);--acc2:#2563eb;
  --green:#059669;--green-soft:rgba(5,150,105,.1);--yellow:#b45309;--yellow-soft:rgba(180,83,9,.1);--red:#dc2626;--red-soft:rgba(220,38,38,.08);
  --fig:#2b3445;--fig2:#9aa4b5;--eq:#c5ccd8;--eq2:#a3adbd;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
p{margin:.35em 0}
small,.small{font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.acc{color:var(--acc)}
a{color:var(--acc2)}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:500}
.topbar .grow{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
main{padding:6px 16px calc(var(--nav-h) + var(--sab) + 90px);max-width:680px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(var(--sab) + 6px)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;min-height:48px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--acc)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.section-title h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.page-head{margin:8px 2px 12px}
.page-head h2{font-size:26px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.card.flat{background:var(--surface2)}
.card h3{margin-bottom:4px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head .grow{flex:1;min-width:0}
.card-head .ic{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.card-head .ic svg{width:21px;height:21px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack>*+*{margin-top:10px}
.divider{height:1px;background:var(--border);margin:12px 0}

/* stats */
.stat{background:var(--surface2);border-radius:12px;padding:11px 12px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600}
.stat .d{font-size:12px;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-weight:650;cursor:pointer;font-size:15px;text-decoration:none;color:var(--text)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
.btn.sm{white-space:nowrap;min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.linkbtn{border:0;background:none;color:var(--acc2);font-weight:600;cursor:pointer;padding:6px 2px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface3);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--acc-soft);color:var(--acc)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2)}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;min-height:44px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:44px;display:block}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.range{display:flex;align-items:center;gap:12px}
.range output{min-width:38px;text-align:right;font-weight:750;font-variant-numeric:tabular-nums;font-size:17px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surface3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--text);margin-top:-10px;border:3px solid var(--acc)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--text);border:3px solid var(--acc)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:650;color:var(--muted);cursor:pointer;min-height:38px;font-size:14px}
.seg button.on{background:var(--surface3);color:var(--text)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:0 0 auto;padding:8px 13px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:1px solid var(--border);background:var(--surface2);border-radius:10px;min-width:44px;min-height:40px;font-weight:700;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* progress */
.bar{height:9px;border-radius:6px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.bar.green>i{background:var(--green)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}

/* lists */
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);min-height:56px}
.li:first-child{border-top:0}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--surface2)}
.li .t{font-weight:650}
.li .s{font-size:13px;color:var(--muted)}
.li .thumb{width:58px;height:52px;border-radius:10px;background:var(--surface2);flex:none;display:grid;place-items:center;overflow:hidden}
.li .thumb svg{width:100%;height:100%}
.li .chev{color:var(--faint)}
.status{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none;cursor:pointer;background:none}
.status.done{background:var(--green);border-color:var(--green);color:#06281b}
.status.skip{background:var(--surface3);border-color:var(--surface3);color:var(--muted)}
.status svg{width:16px;height:16px}

/* readiness */
.ready{border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.ready.green{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.ready.yellow{background:var(--yellow-soft);border-color:color-mix(in srgb,var(--yellow) 35%,transparent)}
.ready.red{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.ready .lvl{font-weight:800;font-size:13px;letter-spacing:.08em}
.ready.green .lvl{color:var(--green)}.ready.yellow .lvl{color:var(--yellow)}.ready.red .lvl{color:var(--red)}
.reasons{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.reasons li{display:flex;gap:8px;align-items:center;padding:2px 0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}

/* notices */
.notice{border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;border:1px solid var(--border);background:var(--surface2);display:flex;gap:10px}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.notice.warn{background:var(--yellow-soft);border-color:color-mix(in srgb,var(--yellow) 35%,transparent)}
.notice.warn svg{color:var(--yellow)}
.notice.danger{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.notice.danger svg{color:var(--red)}
.notice.info svg{color:var(--acc2)}
.notice.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.notice.ok svg{color:var(--green)}
.notice b{font-weight:700}
.banner-approval{background:var(--red-soft);border:1.5px solid var(--red);color:var(--text);border-radius:14px;padding:12px 14px;font-weight:800;font-size:13.5px;letter-spacing:.02em;margin-bottom:12px;text-align:center}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}
.wd{min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;min-height:64px}
.wd .n{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wd .dt{font-size:17px;font-weight:750;margin-top:1px}
.wd .ty{font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.wd.sel{border-color:var(--acc);background:var(--acc-soft)}
.wd.today .dt{color:var(--acc)}
.wd .pip{width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.wd .pip.done{background:var(--green)}.wd .pip.part{background:var(--yellow)}

/* illustrations */
.fig{width:100%;height:auto;display:block}
.figwrap{background:var(--surface2);border-radius:14px;padding:6px;margin:10px 0}
.fig .gnd{stroke:var(--eq2);stroke-width:1.5}
.fig .fdiv{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.fig .fN{stroke:var(--fig);fill:none;stroke-linecap:round}
.fig .fF{stroke:var(--fig2);fill:none;stroke-linecap:round}
.fig .fNh{fill:var(--fig)}.fig .fFh{fill:var(--fig2)}
.fig .fbody{fill:var(--fig);stroke:var(--fig);stroke-width:6;stroke-linejoin:round}
.fig .eye{fill:var(--surface2)}
.fig .crease{stroke:var(--surface2);stroke-width:1.6;stroke-linecap:round}
.fig .ghost{opacity:.22}
.fig .eq{fill:var(--eq2)}
.fig .eqs{stroke:var(--eq2);stroke-width:2.5;fill:none;stroke-linecap:round}
.fig .eqbox{fill:var(--eq);stroke:var(--eq2);stroke-width:1}
.fig .eqline{stroke:var(--eq2);stroke-linecap:round;fill:none}
.fig .eqframe{stroke:var(--eq2);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .eqring{stroke:var(--eq2);stroke-width:2.5;fill:none}
.fig .cable{stroke:var(--eq2);stroke-width:1.4;stroke-dasharray:2 2}
.fig .cone{fill:var(--acc)}
.fig .conet{fill:var(--acc)}
.fig .ball{fill:#e8722a}
.fig .ballline{stroke:#7a2f08;stroke-width:1;fill:none}
.fig .rim{stroke:var(--acc);stroke-linecap:round}
.fig .net{stroke:var(--muted);stroke-width:1;fill:none}
.fig .rimtop{stroke:var(--acc);stroke-width:2.5;fill:none}
.fig .arw{stroke:var(--acc);stroke-width:2.6;fill:none;stroke-linecap:round}
.fig .arwh{stroke:var(--acc);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .arw.m,.fig .arwh.m{stroke:var(--acc2)}
.fig .arw.dash{stroke-dasharray:4 4}
.fig .palm{stroke:var(--acc2);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:3 3}
.fig .band{stroke:var(--green);stroke-width:2.5;fill:none}
.fig .foot{fill:var(--fig2)}.fig .foot.acc{fill:var(--acc)}
.fig .court{fill:none;stroke:var(--eq2);stroke-width:1.5}
.fig .courtl{fill:none;stroke:var(--eq2);stroke-width:1}
.fig .flabel{font-size:8.5px;font-weight:700;fill:var(--muted);letter-spacing:.02em}
.fig .ftxt{font-size:8px;font-weight:650;fill:var(--text)}
.fig .ftxt.muted{fill:var(--muted)}.fig .ftxt.acc{fill:var(--acc)}.fig .ftxt.tiny{font-size:6px;fill:var(--bg)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:calc(100% - var(--sat) - 18px);background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--border);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.sheet .sh-head h3{flex:1;font-size:18px;min-width:0}
.sheet .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 24px)}
body.sheet-open .timer{bottom:calc(var(--sab) + 12px)}
body.timer-on .sheet .sh-body{padding-bottom:calc(var(--sab) + 96px)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface3);margin:8px auto 0}

/* exercise detail */
.rx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rx .stat .v{font-size:17px}
ol.steps,ul.bul{margin:6px 0;padding-left:20px}
ol.steps li,ul.bul li{margin:5px 0}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.setrow .n{font-weight:750;color:var(--muted);text-align:center}
.setrow input{min-height:42px;padding:8px 10px;text-align:center}
.setrow .status{width:40px;height:40px}
.hist{font-size:13px}
.hist .h{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)}

/* timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--sab) + 12px);z-index:70;background:var(--surface3);border:1px solid var(--border);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:656px;margin:0 auto}
.timer .tt{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:84px}
.timer .lab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.timer.done{background:var(--acc);color:#fff}
.timer.done .lab{color:#fff}
.timer .btn{min-height:40px;padding:0 11px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--border);stroke-width:1}
.chart .gl{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart text{font-size:10.5px;fill:var(--muted)}
.chart .goal{stroke:var(--green);stroke-dasharray:5 4;stroke-width:1.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface2);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ph.sel{outline:3px solid var(--acc);outline-offset:-3px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.compare img{width:100%;border-radius:10px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--surface2)}

/* milestones */
.ms{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--border);align-items:flex-start}
.ms:first-child{border-top:0}
.ms .num{width:30px;height:30px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;cursor:pointer;border:0;color:var(--muted)}
.ms.done .num{background:var(--green);color:#06281b}
.ms .t{font-weight:650}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-140%);z-index:80;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;transition:transform .25s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border);font-size:14px;gap:10px}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--acc2);font-weight:600;font-size:14px;list-style:none;padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 4px;border-top:1px solid var(--border);text-align:left}
.tbl th{color:var(--muted);font-weight:650;font-size:12px}
@media (min-width:520px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.row:has(> .btn.sm + .btn.sm){flex-wrap:wrap}
.askwrap{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.askbox{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;max-width:420px;width:100%}
#askMsg{white-space:pre-line;margin:0;font-weight:550}
.rir{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 10px 38px}
.rir button{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:8px;min-height:34px;font-size:12px;font-weight:650;cursor:pointer;padding:0 2px}
.rir button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.page-head.row{align-items:center}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="brandLogo" aria-hidden="true"></span><div><div>HoopLab</div><div class="sub" id="topSub"></div></div></div>
  <div class="grow"></div>
  <button class="iconbtn" id="setBtn" data-act="settings" aria-label="Settings and backup"></button>
</header>
<main id="main"></main>
<div id="timer" class="timer hidden" role="timer" aria-live="polite">
  <div><div class="lab" id="tLabel">Rest</div><div class="tt" id="tTime">0:00</div></div>
  <div class="grow"></div>
  <button class="btn" id="tToggle" data-act="tToggle" aria-label="Start or pause"></button>
  <button class="btn" data-act="tAdd" aria-label="Add 15 seconds">+15s</button>
  <button class="btn" id="tReset" data-act="tReset" aria-label="Reset timer"></button>
  <button class="btn" id="tClose" data-act="tClose" aria-label="Close timer"></button>
</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="scrim" class="scrim hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sh-head"><h3 id="sheetTitle"></h3><button class="iconbtn" id="sheetClose" data-act="close" aria-label="Close"></button></div>
  <div class="sh-body" id="sheetBody"></div>
</section>
<div id="toast" class="toast" role="status"></div>
<div id="ask" class="askwrap hidden" role="alertdialog" aria-modal="true" aria-labelledby="askMsg"><div class="askbox"><p id="askMsg"></p><div class="row" style="margin-top:14px"><button class="btn grow" id="askCancel">Cancel</button><button class="btn primary grow" id="askOk">Confirm</button></div></div></div>
<script>
/* ---- figures.js ---- */
/* HoopLab — vector exercise illustration engine.
   Figures are built from joint angles (0° = straight down, 90° = forward/right, 180° = up, -90° = back/left)
   so every pose is anatomically proportioned. No external images are used. */
const FIG = (() => {
  const L = { thigh: 24, shin: 23, foot: 8, torso: 33, ua: 16, fa: 15, hr: 7 };
  const PW = 120, PH = 140, FLOOR = 132;
  const rad = a => a * Math.PI / 180;
  const d = (a, len) => [Math.sin(rad(a)) * len, Math.cos(rad(a)) * len];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const f = n => Math.round(n * 10) / 10;
  const P = p => `${f(p[0])},${f(p[1])}`;

  function solve(p) {
    const hip = p.hip ? [...p.hip] : [60, 60];
    const front = !!p.front;
    const t = p.torso ?? 180;
    const hw = front ? 6 : 0, sw = front ? 11 : 0;
    const sh = add(hip, d(t, L.torso));
    const head = add(sh, d(p.headA ?? t, L.hr + 4));
    const J = { hip, sh, head };
    [['N', hw], ['F', -hw]].forEach(([k, off]) => {
      const s = p['leg' + k] || [0, 0, 90];
      const root = [hip[0] + off, hip[1]];
      const knee = add(root, d(s[0], L.thigh));
      const ankle = add(knee, d(s[1], L.shin));
      const fa = s[2] ?? (front ? (k === 'N' ? 90 : -90) : 90);
      const toe = add(ankle, d(fa, L.foot * (front ? 0.6 : 1)));
      Object.assign(J, { ['hip' + k]: root, ['knee' + k]: knee, ['ankle' + k]: ankle, ['toe' + k]: toe });
    });
    [['N', sw], ['F', -sw]].forEach(([k, off]) => {
      const s = p['arm' + k] || [4, 4];
      const root = [sh[0] + off, sh[1]];
      const elbow = add(root, d(s[0], L.ua));
      const hand = add(elbow, d(s[1], L.fa));
      Object.assign(J, { ['sh' + k]: root, ['elbow' + k]: elbow, ['hand' + k]: hand });
    });
    if (!p.hip) {
      let maxY;
      if (p.ground === 'all') {
        maxY = Math.max(...Object.entries(J).map(([n, v]) => v[1] + (n === 'head' ? L.hr : n.startsWith('hand') ? 3.5 : (n === 'hip' || n === 'sh') ? 7.5 : 4)));
      } else {
        maxY = Math.max(J.ankleN[1] + 3, J.toeN[1] + 2.5, J.ankleF[1] + 3, J.toeF[1] + 2.5);
      }
      const pts = Object.values(J);
      const minY = Math.min(...pts.map(v => v[1])) - L.hr - 2;
      let lift = p.lift || 0;
      const top = FLOOR - maxY - lift + minY - 0; // top after shift
      const over = 17 - (minY + FLOOR - maxY - lift);
      if (over > 0 && lift > 0) lift = Math.max(3, lift - over);
      const dy = FLOOR - maxY - lift;
      let dx;
      if (p.x != null) dx = p.x - hip[0];
      else { const xs = pts.map(v => v[0]); dx = 60 - (Math.min(...xs) + Math.max(...xs)) / 2; }
      for (const k in J) J[k] = [J[k][0] + dx, J[k][1] + dy];
    }
    return J;
  }

  const seg = (a, b, w, c) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke-width="${w}" class="${c}"/>`;
  const dot = (p, r, c) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" class="${c}"/>`;

  function figure(J, p, cls = '') {
    const front = !!p.front;
    const arm = (k, c) => seg(J['sh' + k], J['elbow' + k], 7.5, c) + seg(J['elbow' + k], J['hand' + k], 6.2, c) + dot(J['hand' + k], 3.6, c + 'h');
    const leg = (k, c) => seg(J['hip' + k], J['knee' + k], 10.5, c) + seg(J['knee' + k], J['ankle' + k], 8.2, c) + seg(J['ankle' + k], J['toe' + k], 5, c);
    let s = `<g class="figure ${cls}">`;
    if (front) {
      s += leg('N', 'fN') + leg('F', 'fN');
      const a = add(J.hipN, [3, 2]), b = add(J.hipF, [-3, 2]), c = add(J.shF, [-2, 0]), e = add(J.shN, [2, 0]);
      s += `<path d="M${P(a)}L${P(b)}L${P(c)}L${P(e)}Z" class="fbody"/>`;
      s += seg(J.sh, J.head, 6, 'fN') + dot(J.head, L.hr, 'fNh');
      s += arm('N', 'fN') + arm('F', 'fN');
    } else {
      s += arm('F', 'fF') + leg('F', 'fF');
      s += seg(J.hip, J.sh, 15, 'fN') + seg(J.sh, J.head, 6, 'fN') + dot(J.head, L.hr, 'fNh');
      s += leg('N', 'fN') + arm('N', 'fN');
      if (p.farFront) s += arm('F', 'fF');
      s += dot(add(J.head, [ (p.face ?? 1) * 4.5, -1]), 1.3, 'eye');
    }
    return s + '</g>';
  }

  const pt = (J, v) => (typeof v === 'string' ? J[v] : v);

  const PROPS = {
    kb: (J, o) => { const [x, y] = add(pt(J, o.at), o.off || [3, 5]); return `<path d="M${f(x - 4)},${f(y - 4)} q4,-8 8,0" class="eqs"/><circle cx="${f(x)}" cy="${f(y + 1)}" r="6.5" class="eq"/>`; },
    db: (J, o) => {
      const [x, y] = add(pt(J, o.at), o.off || [0, 0]);
      if (o.v) return `<rect x="${f(x - 1.5)}" y="${f(y - 7)}" width="3" height="14" class="eq"/><rect x="${f(x - 4.5)}" y="${f(y - 8.5)}" width="9" height="4" rx="1.2" class="eq"/><rect x="${f(x - 4.5)}" y="${f(y + 4.5)}" width="9" height="4" rx="1.2" class="eq"/>`;
      return `<rect x="${f(x - 7)}" y="${f(y - 1.5)}" width="14" height="3" class="eq"/><rect x="${f(x - 8.5)}" y="${f(y - 4.5)}" width="4" height="9" rx="1.2" class="eq"/><rect x="${f(x + 4.5)}" y="${f(y - 4.5)}" width="4" height="9" rx="1.2" class="eq"/>`;
    },
    bench: (J, o) => `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h || 5}" rx="2" class="eq"/><line x1="${o.x + 5}" y1="${o.y + 4}" x2="${o.x + 5}" y2="${FLOOR}" class="eqs"/><line x1="${o.x + o.w - 5}" y1="${o.y + 4}" x2="${o.x + o.w - 5}" y2="${FLOOR}" class="eqs"/>`,
    box: (J, o) => `<rect x="${o.x}" y="${FLOOR - o.h}" width="${o.w}" height="${o.h}" rx="2" class="eqbox"/>`,
    table: (J, o) => `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="5" rx="1.5" class="eq"/><line x1="${o.x + o.w - 8}" y1="${o.y + 5}" x2="${o.x + o.w - 8}" y2="${FLOOR}" class="eqs"/>`,
    seat: (J, o) => `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="5" rx="2" class="eq"/><line x1="${o.x + o.w / 2}" y1="${o.y + 5}" x2="${o.x + o.w / 2}" y2="${FLOOR}" class="eqs"/><line x1="${o.x + o.w / 2 - 12}" y1="${FLOOR}" x2="${o.x + o.w / 2 + 12}" y2="${FLOOR}" class="eqs"/>`,
    pad: (J, o) => `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke-width="6" class="eqline"/>`,
    cable: (J, o) => { const a = pt(J, o.from), b = o.to; return `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${b[0]}" y2="${b[1]}" class="cable"/><circle cx="${b[0]}" cy="${b[1]}" r="4" class="eq"/>`; },
    stack: (J, o) => `<rect x="${o.x}" y="${o.y}" width="${o.w || 10}" height="${FLOOR - o.y}" rx="2" class="eqbox"/>`,
    handle: (J, o) => { const [x, y] = pt(J, o.at); return o.v ? `<line x1="${f(x)}" y1="${f(y - 6)}" x2="${f(x)}" y2="${f(y + 6)}" stroke-width="3.5" class="eqline"/>` : `<line x1="${f(x - 9)}" y1="${f(y)}" x2="${f(x + 9)}" y2="${f(y)}" stroke-width="3.5" class="eqline"/>`; },
    cone: (J, o) => `<path d="M${o.x - 5},${FLOOR} L${o.x},${FLOOR - 11} L${o.x + 5},${FLOOR}Z" class="cone"/>`,
    ball: (J, o) => { const [x, y] = o.at ? add(pt(J, o.at), o.off || [0, 0]) : [o.x, o.y]; const r = o.r || 6; return `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" class="ball"/><path d="M${f(x - r)},${f(y)}H${f(x + r)}M${f(x)},${f(y - r)}V${f(y + r)}" class="ballline"/>`; },
    tball: (J, o) => { const [x, y] = add(pt(J, o.at), o.off || [0, 0]); return `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 5}" class="eq"/>`; },
    hoop: (J, o) => `<line x1="${o.x + 14}" y1="${o.y - 20}" x2="${o.x + 14}" y2="${o.y + 6}" stroke-width="3" class="eqline"/><line x1="${o.x - 8}" y1="${o.y}" x2="${o.x + 14}" y2="${o.y}" stroke-width="2.5" class="rim"/><path d="M${o.x - 7},${o.y + 1} L${o.x - 3},${o.y + 11} L${o.x + 9},${o.y + 11} L${o.x + 13},${o.y + 1}" class="net"/>`,
    mark: (J, o) => `<line x1="${o.x}" y1="${FLOOR - 1}" x2="${o.x}" y2="${FLOOR + 3}" stroke-width="2" class="eqline"/>`,
    wall: (J, o) => `<rect x="${o.x}" y="20" width="6" height="${FLOOR - 20}" class="eqbox"/>`,
    plate: (J, o) => `<line x1="${o.x}" y1="${o.y1}" x2="${o.x}" y2="${o.y2}" stroke-width="5" class="eqline"/>`,
    text: (J, o) => `<text x="${o.x}" y="${o.y}" class="ftxt${o.c ? ' ' + o.c : ''}" text-anchor="${o.a || 'middle'}">${o.s}</text>`,
    bike: (J) => {
      const seat = add(J.hip, [-3, 7]); const bar = J.handN;
      const crank = [(J.ankleN[0] + J.ankleF[0]) / 2, (J.ankleN[1] + J.ankleF[1]) / 2];
      const fw = add(crank, [24, 2]);
      return `<line x1="${f(crank[0] - 34)}" y1="${FLOOR}" x2="${f(crank[0] + 40)}" y2="${FLOOR}" stroke-width="4" class="eqline"/>` +
        `<path d="M${P(seat)} L${P(crank)} L${P([crank[0] - 26, FLOOR])}" class="eqframe"/>` +
        `<path d="M${P(crank)} L${P(fw)} L${P([bar[0] + 4, bar[1] + 6])}" class="eqframe"/>` +
        `<line x1="${f(fw[0])}" y1="${f(fw[1])}" x2="${f(fw[0] + 8)}" y2="${FLOOR}" class="eqframe"/>` +
        `<circle cx="${f(fw[0])}" cy="${f(fw[1])}" r="11" class="eqring"/>` +
        `<rect x="${f(seat[0] - 9)}" y="${f(seat[1] - 2)}" width="17" height="4.5" rx="2" class="eq"/>` +
        `<line x1="${f(bar[0] - 3)}" y1="${f(bar[1])}" x2="${f(bar[0] + 6)}" y2="${f(bar[1] + 1)}" stroke-width="3.5" class="eqline"/>` +
        `<circle cx="${f(crank[0])}" cy="${f(crank[1])}" r="9" class="eqring"/>`;
    },
    incline: (J, o) => `<path d="M2,${FLOOR} L118,${FLOOR - 10} L118,${FLOOR + 2} L2,${FLOOR + 2}Z" class="eqbox"/>`
  };

  function arrow(J, a) {
    const A = add(pt(J, a.a), a.ao || [0, 0]), B = add(pt(J, a.b ?? a.a), a.bo || [0, 0]);
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1];
    const len = Math.hypot(dx, dy) || 1, k = a.c || 0;
    const C = [mx - dy / len * k, my + dx / len * k];
    const head = (tip, from) => {
      const ux = tip[0] - from[0], uy = tip[1] - from[1], ul = Math.hypot(ux, uy) || 1, nx = ux / ul, ny = uy / ul, hs = 5;
      return `<path d="M${P([tip[0] - nx * hs - ny * hs * 0.65, tip[1] - ny * hs + nx * hs * 0.65])}L${P(tip)}L${P([tip[0] - nx * hs + ny * hs * 0.65, tip[1] - ny * hs - nx * hs * 0.65])}" class="arwh${a.m ? ' m' : ''}"/>`;
    };
    let s = `<path d="M${P(A)} Q${P(C)} ${P(B)}" class="arw${a.dash ? ' dash' : ''}${a.m ? ' m' : ''}"/>` + head(B, C);
    if (a.both) s += head(A, C);
    return s;
  }

  function panel(fr, i) {
    const J = fr.pose ? solve(fr.pose) : {};
    let s = `<g transform="translate(${i * PW},0)">`;
    if (!fr.noFloor) s += `<line x1="3" y1="${FLOOR}" x2="${PW - 3}" y2="${FLOOR}" class="gnd"/>`;
    (fr.props || []).filter(o => !o.front).forEach(o => (s += PROPS[o.t](J, o)));
    if (fr.raw) s += typeof fr.raw === 'function' ? fr.raw() : fr.raw;
    if (fr.ghost) { const G = solve(fr.ghost); s += figure(G, fr.ghost, 'ghost'); }
    if (fr.pose) s += figure(J, fr.pose);
    (fr.props || []).filter(o => o.front).forEach(o => (s += PROPS[o.t](J, o)));
    (fr.arrows || []).forEach(a => (s += arrow(J, a)));
    if (fr.label) s += `<text x="5" y="11" class="flabel">${i + 1} · ${fr.label}</text>`;
    return s + '</g>';
  }

  function render(frames, opts = {}) {
    if (!frames || !frames.length) return '';
    const n = frames.length;
    let s = `<svg viewBox="0 0 ${n * PW} ${PH}" class="fig" role="img" aria-label="${opts.alt || 'Exercise illustration'}" xmlns="http://www.w3.org/2000/svg">`;
    for (let i = 1; i < n; i++) s += `<line x1="${i * PW}" y1="14" x2="${i * PW}" y2="${PH - 14}" class="fdiv"/>`;
    frames.forEach((fr, i) => (s += panel(fr, i)));
    return s + '</svg>';
  }

  /* ---------- Forearm / hand close-ups for rehab (side view, forearm on a table) ---------- */
  const H = {};
  H.table = (y = 89, w = 120) => `<rect x="0" y="${y}" width="${w}" height="6" rx="2" class="eq"/><line x1="10" y1="${y + 6}" x2="10" y2="${y + 16}" class="eqs"/>`;
  // affected (right) forearm resting on table: elbow (12,y) → wrist (wx,y)
  H.forearm = (y = 80, wx = 56) => seg([2, 26], [12, y], 17, 'fN') + seg([12, y], [wx, y], 15, 'fN');
  // hand from wrist w at angle ang (0 = straight ahead, +ve = up). palm: 'up'|'down'. fist / curl / open
  H.hand = (w, ang, o = {}) => {
    const u = [Math.cos(rad(ang)), -Math.sin(rad(ang))];
    const nUp = [u[1], -u[0]];
    const c = o.cls || 'fN';
    const m = add(w, [u[0] * 17, u[1] * 17]);
    let s = seg(add(w, [u[0] * 2, u[1] * 2]), m, 16.5, c);
    if (o.fist) { const fc = add(m, [u[0] * 3, u[1] * 3]); s += `<circle cx="${f(fc[0])}" cy="${f(fc[1])}" r="10.5" class="${c}h"/>`; const k1 = add(fc, [nUp[0] * 5 + u[0] * 4, nUp[1] * 5 + u[1] * 4]), k2 = add(fc, [-nUp[0] * 5 + u[0] * 4, -nUp[1] * 5 + u[1] * 4]); s += `<line x1="${f(k1[0])}" y1="${f(k1[1])}" x2="${f(k2[0])}" y2="${f(k2[1])}" class="crease"/>`; }
    else if (o.curl) { const k = add(m, [u[0] * 9, u[1] * 9]); s += seg(m, k, 11, c) + seg(k, add(k, [nUp[0] * 9 + u[0] * 2, nUp[1] * 9 + u[1] * 2]), 10, c); }
    else s += seg(m, add(m, [u[0] * 18, u[1] * 18]), 11, c);
    // wrist crease so the hand reads as a separate segment
    const c1 = add(w, [nUp[0] * 7, nUp[1] * 7]), c2 = add(w, [-nUp[0] * 7, -nUp[1] * 7]);
    s += `<line x1="${f(c1[0])}" y1="${f(c1[1])}" x2="${f(c2[0])}" y2="${f(c2[1])}" class="crease"/>`;
    if (o.palm === 'up' || o.palm === 'down') {
      const sg = o.palm === 'up' ? 1 : -1;
      const a = add(w, [nUp[0] * 10.5 * sg + u[0] * 3, nUp[1] * 10.5 * sg + u[1] * 3]);
      const b = add(a, [u[0] * 15, u[1] * 15]);
      s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="palm"/>`;
    }
    return s;
  };
  H.helper = (from, to, w = 12) => { const dx = to[0] - from[0], dy = to[1] - from[1], l = Math.hypot(dx, dy); const t2 = [to[0] + dx / l * 14, to[1] + dy / l * 14]; return seg(from, to, w, 'fF') + seg(to, t2, 13, 'fF') + `<line x1="${f(to[0] - dy / l * 6)}" y1="${f(to[1] + dx / l * 6)}" x2="${f(to[0] + dy / l * 6)}" y2="${f(to[1] - dx / l * 6)}" class="crease"/>`; };
  H.arrow = (a, b, opt = {}) => arrow({}, Object.assign({ a, b }, opt));
  H.txt = (x, y, s, c = '') => `<text x="${x}" y="${y}" class="ftxt ${c}" text-anchor="middle">${s}</text>`;

  // top-down hand for finger extension
  H.handTop = (cx, cy, spread, band) => {
    let s = `<rect x="${cx - 13}" y="${cy - 4}" width="26" height="30" rx="10" class="fNh"/>` + seg([cx, cy + 22], [cx, cy + 50], 18, 'fN');
    const angs = [-1.5, -0.5, 0.5, 1.5].map(k => k * (spread ? 13 : 3.5));
    const xs = [-9, -3, 3, 9];
    const lens = [20, 24, 23, 18];
    const tips = [];
    angs.forEach((a, i) => { const b = [cx + xs[i], cy]; const t = add(b, [Math.sin(rad(a)) * lens[i], -Math.cos(rad(a)) * lens[i]]); tips.push(t); s += seg(b, t, 6, 'fN'); });
    // thumb
    s += seg([cx - 12, cy + 16], [cx - 22 - (spread ? 4 : 0), cy + 3], 7, 'fN');
    if (band) {
      const pts = tips.map(t => add(t, [0, 7]));
      s += `<path d="M${P(pts[0])} ${pts.slice(1).map(p => 'L' + P(p)).join(' ')}" class="band"/>`;
      s += `<path d="M${P(pts[0])} Q${f(cx)},${f(pts[0][1] + 7)} ${P(pts[3])}" class="band"/>`;
    }
    return s;
  };

  return { render, H, PW, PH, FLOOR, solve };
})();

    const cx = 60, cy = 74;

    const tr = (a, rr) => [cx - Math.cos(a * Math.PI / 180) * rr, cy - Math.sin(a * Math.PI / 180) * rr];
    const t = tr(thumbA, 26);
    const palmSide = deg < 45 ? 'down' : deg > 135 ? 'up' : 'side';
    let s = `<rect x="18" y="98" width="84" height="6" rx="2" class="eq"/>`;
    s += `<g transform="rotate(${deg} ${cx} ${cy})"><rect x="${cx - 28}" y="${cy - 9}" width="56" height="18" rx="9" class="fNh"/>` +
      `<line x1="${cx - 22}" y1="${cy + 11}" x2="${cx + 22}" y2="${cy + 11}" class="palm"/></g>`;
    s += `<circle cx="${t[0].toFixed(1)}" cy="${t[1].toFixed(1)}" r="6" class="fNh"/>`;
    s += `<text x="${t[0].toFixed(1)}" y="${(t[1] + 2.5).toFixed(1)}" class="ftxt tiny" text-anchor="middle">T</text>`;
    s += `<path d="M30,40 A36,36 0 0 1 90,40" class="arw m dash"/>`;
    s += `<text x="60" y="124" class="ftxt muted" text-anchor="middle">${palmSide === 'down' ? 'palm faces table' : palmSide === 'up' ? 'palm faces ceiling' : 'thumb up'}</text>`;
    return s;
  }

const PhotoDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
      const r = indexedDB.open('hooplab', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('photos')) r.result.createObjectStore('photos', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', mode); const st = tx.objectStore('photos');
      const out = fn(st);
      tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all() { return this.run('readonly', st => st.getAll()); },
  put(rec) { return this.run('readwrite', st => st.put(rec)); },
  del(id) { return this.run('readwrite', st => st.delete(id)); },
  clear() { return this.run('readwrite', st => st.clear()); }
};
const photoURLs = new Map();
function photoURL(p) {
  if (photoURLs.has(p.id)) return photoURLs.get(p.id);
  const u = URL.createObjectURL(new Blob([p.data], { type: p.type || 'image/jpeg' }));
  photoURLs.set(p.id, u); return u;
}
async function compressImage(file, maxSide = 1280, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read image')); i.src = url; });
    const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', q));
    return { data: await blob.arrayBuffer(), type: 'image/jpeg', w, h, size: blob.size };
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- rest timer ---------- */
const TIMER = {
  end: 0, remain: 0, total: 0, running: false, label: 'Rest', visible: false, done: false, iv: null, ac: null,
  start(sec, label = 'Rest') {
    this.total = sec; this.remain = sec * 1000; this.label = label; this.done = false; this.visible = true;
    try { this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)(); this.ac.resume && this.ac.resume(); } catch (e) { }
    this.resume();
  },
  resume() { if (this.remain <= 0) return; this.end = Date.now() + this.remain; this.running = true; this.loop(); this.draw(); },
  pause() { if (!this.running) return; this.remain = Math.max(0, this.end - Date.now()); this.running = false; clearInterval(this.iv); this.draw(); },
  reset() { this.remain = this.total * 1000; this.running = false; this.done = false; clearInterval(this.iv); this.draw(); },
  add(s) { if (this.running) this.end += s * 1000; else this.remain = Math.max(0, this.remain + s * 1000); this.total += s; this.done = false; this.draw(); },
  close() { this.running = false; this.visible = false; clearInterval(this.iv); this.draw(); },
  loop() {
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      if (!this.running) return;
      const left = this.end - Date.now();
      if (left <= 0) { this.remain = 0; this.running = false; this.done = true; clearInterval(this.iv); this.beep(); }
      this.draw();
    }, 250);
  },
  left() { return this.running ? Math.max(0, this.end - Date.now()) : this.remain; },
  beep() {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
    try {
      const ac = this.ac; if (!ac) return;
      [0, 0.25, 0.5].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.18); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.2); });
    } catch (e) { }
  },
  fmt(ms) { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; },
  draw() {
    const el = $('#timer'); if (!el) return;
    el.classList.toggle('hidden', !this.visible); document.body.classList.toggle('timer-on', this.visible);
    el.classList.toggle('done', this.done);
    if (!this.visible) return;
    $('#tLabel').textContent = this.done ? `${this.label} — done` : this.label;
    $('#tTime').textContent = this.fmt(this.left());
    $('#tToggle').innerHTML = this.running ? IC.pause : IC.play;
    $('#tToggle').setAttribute('aria-label', this.running ? 'Pause timer' : 'Start timer');
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) TIMER.draw(); });

/* ---------- charts (inline SVG) ---------- */
function lineChart(o) {
  const series = o.series.map(s => Object.assign({}, s, { pts: s.pts.filter(p => p.y != null && Number.isFinite(p.y)).sort((a, b) => dnum(a.x) - dnum(b.x)) }));
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">${o.empty || 'No data yet'}</div>`;
  const W = 340, H = o.h || 170, pl = 34, pr = 12, pt = 12, pb = 24;
  const xs = all.map(p => dnum(p.x));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 - x0 < 6) { const c = (x0 + x1) / 2; x0 = c - 3; x1 = c + 3; }
  const ys = all.map(p => p.y); if (o.goal != null) ys.push(o.goal);
  let y0 = o.yMin ?? Math.min(...ys), y1 = o.yMax ?? Math.max(...ys);
  if (y1 - y0 < (o.minSpan || 2)) { const c = (y0 + y1) / 2, h = (o.minSpan || 2) / 2; y0 = o.yMin ?? c - h; y1 = o.yMax ?? c + h; }
  if (o.yMin == null) y0 -= (y1 - y0) * 0.08; if (o.yMax == null) y1 += (y1 - y0) * 0.08;
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.alt || 'chart')}">`;
  for (let k = 0; k <= 3; k++) { const v = y0 + (y1 - y0) * k / 3, y = Y(v); s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="gl"/><text x="${pl - 5}" y="${y + 3.5}" text-anchor="end">${o.fmt ? o.fmt(v) : r1(v)}</text>`; }
  if (o.goal != null) s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" class="goal"/><text x="${W - pr}" y="${Y(o.goal) - 4}" text-anchor="end" style="fill:var(--green)">${o.goalLabel || 'goal'}</text>`;
  const minD = all.reduce((a, p) => (dnum(p.x) < dnum(a) ? p.x : a), all[0].x), maxD = all.reduce((a, p) => (dnum(p.x) > dnum(a) ? p.x : a), all[0].x);
  s += `<text x="${pl}" y="${H - 6}">${fmtD(minD)}</text>`;
  if (minD !== maxD) s += `<text x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtD(maxD)}</text>`;
  series.forEach(se => {
    if (!se.pts.length) return;
    const path = se.pts.map((p, i) => `${i ? 'L' : 'M'}${X(dnum(p.x)).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    if (se.pts.length > 1) s += `<path d="${path}" class="ln" style="stroke:${se.color}${se.dash ? ';stroke-dasharray:5 4' : ''}"/>`;
    se.pts.forEach(p => (s += `<circle cx="${X(dnum(p.x)).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${se.pts.length > 30 ? 2.5 : 3.8}" class="pt" style="fill:${se.color}"/>`));
  });
  s += '</svg>';
  if (series.length > 1 || o.legend) s += `<div class="legend">${series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`;
  return s;
}
function barChart(o) {
  if (!o.bars.length) return `<div class="empty">${o.empty || 'No data yet'}</div>`;
  const W = 340, H = o.h || 150, pl = 30, pr = 6, pt = 14, pb = 22, n = o.bars.length;
  const max = o.max || Math.max(1, ...o.bars.map(b => b.v || 0));
  const bw = (W - pl - pr) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.alt || 'bar chart')}">`;
  [0, 0.5, 1].forEach(k => { const y = pt + (1 - k) * (H - pt - pb); s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="gl"/><text x="${pl - 4}" y="${y + 3.5}" text-anchor="end">${o.fmt ? o.fmt(max * k) : Math.round(max * k)}</text>`; });
  if (o.goal != null) { const y = pt + (1 - o.goal / max) * (H - pt - pb); s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="goal"/>`; }
  o.bars.forEach((b, i) => {
    const v = b.v || 0, h = (Math.min(v, max) / max) * (H - pt - pb), x = pl + i * bw + bw * 0.18, y = H - pb - h;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(h, v ? 2 : 0).toFixed(1)}" rx="3" style="fill:${b.color || 'var(--acc)'}"/>`;
    if (b.top) s += `<text x="${(x + bw * 0.32).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" style="font-size:9.5px">${b.top}</text>`;
    s += `<text x="${(x + bw * 0.32).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(b.label)}</text>`;

}
function ring(pct, label) {

/* ---------- download / share ---------- */
async function saveFile(name, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  // Inside the claude.ai viewer, plain downloads are blocked: use its save prompt.
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { }
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); return 'downloaded'; }
      catch (e) { if (e && e.code === 'declined') return 'cancelled'; toast('Save failed here (' + (e && e.code || 'error') + '). Use "Copy backup text" instead.'); return 'cancelled'; }
    }
  }
  const file = typeof File === 'function' ? new File([blob], name, { type }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); return 'shared'; } catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return 'downloaded';
}

  h += `<div class="card"><div class="card-head"><div class="ic">${IC[{ rest: 'rest', ball: 'ball', bike: 'bike', legs: 'legs', arm: 'arm', bolt: 'bolt', feet: 'feet' }[pl.icon]]}</div><div class="grow"><h3>Today's session</h3><div class="muted small">${pl.purpose.join(' · ')}</div></div>${pl.type !== 'rest' ? ring(prog.pct, `${prog.done}/${prog.total}`) : ''}</div>`;
  if (pl.type === 'rest') h += `<p class="muted">Recovery before tomorrow's game. Optional: gentle mobility and a comfortable walk.</p>`;
  else if (lvl === 'yellow' || lvl === 'red') h += `<p class="small" style="color:var(--${lvl})"><b>${PROGRAM.READY_TEXT[lvl].t}.</b> Adjusted guidance is shown on each exercise.</p>`;
  h += `<button class="btn primary block" data-act="goto" data-tab="train" data-date="${t}">${pl.type === 'game' ? 'Open game-day plan' : pl.type === 'rest' ? 'View optional recovery' : 'Start workout'}</button>`;
  if (pl.type === 'game') h += `<button class="btn block" style="margin-top:8px" data-act="gameForm" data-date="${t}">${IC.ball} Log today's game</button>`;
  h += `</div>`;
  // elbow: tick the 4 prescribed exercises + heat right here
  const rc = rehabCount(t), heat = !!S.heat[t];
  const SHORT = { rx_flex_iso: 'Wrist flexion hold (3×8, 3 s)', rx_flex_stretch: 'Wrist flexor stretch (2×4, 10 s)', rx_jems: 'Triceps press JEMS (3×8, 5 s)', rx_grip: 'Ball / grip squeeze (3×6, 3 s)' };
  h += `<div class="card"><div class="card-head"><div class="ic">${IC.elbow}</div><div class="grow"><h3>Elbow rehab</h3><div class="muted small">${rc}/4 done · keep discomfort below 4/10</div></div><button class="btn sm" data-act="goto" data-tab="elbow">How-to</button></div>
    ${PRESCRIBED.map(id => `<label class="check"><input type="checkbox" data-chg="rehabTick" data-ex="${id}" data-date="${t}" ${S.rehab[t] && S.rehab[t][id] ? 'checked' : ''}> ${SHORT[id]}</label>`).join('')}
    <label class="check"><input type="checkbox" data-chg="heat" data-date="${t}" ${heat ? 'checked' : ''}> Heat 15 min</label></div>`;
  // protein
  const pt = proteinTotal(t), goal = S.profile.proteinGoal;
  h += `<div class="card"><div class="card-head"><div class="ic">${IC.food}</div><div class="grow"><h3>Protein</h3><div class="muted small">${pt} g of ${goal} g · ${Math.max(0, goal - pt)} g to go</div></div><button class="btn sm primary" data-act="proteinForm" data-date="${t}">${IC.plus} Add</button></div>${bar(pt / goal, pt >= goal ? 'green' : '')}</div>`;
  h += weeklyCard(t);
  const adv = elbowAdvice();
  if (adv) h += notice(adv.lvl === 'danger' ? 'danger' : 'warn', adv.short);
  // everything else lives behind "More"
  h += `<button class="btn block ghost" style="margin-top:4px" data-act="todayMore">${ui.todayMore ? 'Show less' : 'More: coach, reminders, snapshot'}</button>`;
  if (ui.todayMore) {
    h += coachCard();
    h += secTitle('Reminders') + `<div class="card tight">${reminders(t).map(r => `<div class="row" style="padding:6px 0;align-items:flex-start"><span class="dot ${r[0]}" style="margin-top:7px"></span><div class="small">${r[1]}</div></div>`).join('')}</div>`;
    const lw = latestWeight(), ws = weekStats(mondayOf(t)), lj = latestJump(), lg = sortedGames().slice(-1)[0];
    h += secTitle('Snapshot', `<button class="linkbtn" data-act="goto" data-tab="progress" data-sub="overview">All progress</button>`);
    h += `<div class="grid2">
    <div class="stat"><div class="k">Weight</div><div class="v">${lw ? lw.lb : '—'}<small> lb</small></div><div class="d">Goal ${S.profile.goalWeight} lb${lw ? ` · ${r1(lw.lb - S.profile.goalWeight)} to go` : ''}</div></div>
    <div class="stat"><div class="k">This week</div><div class="v">${ws.done}<small>/${ws.planned} sessions</small></div><div class="d">${Math.round(ws.pct * 100)}% complete</div></div>
    <div class="stat"><div class="k">Approach vert</div><div class="v">${lj && lj.approach != null ? lj.approach : '—'}<small> in</small></div><div class="d">${lj ? 'Measured ' + fmtD(lj.date) : 'Not measured yet'}</div></div>
    <div class="stat"><div class="k">Last game</div><div class="v">${lg ? lg.energy : '—'}<small>/5 energy</small></div><div class="d">${lg ? `2nd half ${lg.second ?? '—'}/5 · ${fmtD(lg.date)}` : 'No games logged'}</div></div></div>`;
  }
  h += `<p class="faint small" style="margin-top:16px">HoopLab is a training and self-monitoring tool — not medical care or individualised physiotherapy.</p>`;

}
function reminders(t) {
  const dk = dayKey(t), out = [];
  const R = {
    mon: 'Rest day — basketball tomorrow. Eat normally (don\'t under-eat), hydrate and aim for 7–9 h of sleep.',
    tue: 'Game day: a carb-containing meal 2–3 h before, water through the day, full 8–12 min warm-up, cool-down walk after. Log the game.',
    wed: 'Easy day after the game. Keep cardio conversational — you should finish feeling better.',
    thu: 'Jumps first while fresh. End a set early if landings get loud or height drops.',
    fri: 'Upper body: modify or omit anything that provokes your elbow. Do your prescribed rehab.',
    sat: 'Hard-but-controlled intervals — no all-out sprinting. Refuel with carbs + protein after.',
    sun: 'Controlled agility — no maximal cutting. Good day for the weekly review.'
  };
  out.push(['acc', R[dk]]);
  const hasData = Object.keys(S.workouts).length + S.weights.length + Object.keys(S.readiness).length > 3;
  if (hasData && (!S.profile.lastBackup || daysBetween(S.profile.lastBackup, t) >= 7)) out.push(['yellow', `${S.profile.lastBackup ? `Last backup ${daysBetween(S.profile.lastBackup, t)} days ago.` : 'No backup yet.'} Your data lives only on this phone. <button class="linkbtn" data-act="settings">Back up now</button>`]);
  if (!S.readiness[t]) out.push(['yellow', 'Do your daily readiness check-in (30 seconds).']);
  if (!S.heat[t]) out.push(['', 'Apply heat for 15 minutes today (from your original program).']);
  if (rehabCount(t) < 4) out.push(['', `Prescribed elbow exercises: ${rehabCount(t)}/4 done today.`]);
  return out;
}

/* Weekly check: one short card on Sunday (stays through Monday until done) */
function weeklyCard(t) {
  const dk = dayKey(t);
  if (dk !== 'sun' && dk !== 'mon') return '';
  const sun = dk === 'sun' ? t : addDays(t, -1);
  const inWin = d => d >= sun && d <= addDays(sun, 1);
  const weighed = S.weights.some(w => inWin(w.date));
  const checked = S.program.history.some(x => inWin(x.date));
  const backed = S.profile.lastBackup && daysBetween(S.profile.lastBackup, t) < 7;
  if (dk === 'mon' && weighed && checked && backed) return '';
  const row = (done, label, ctrl) => `<div class="row" style="padding:8px 0;border-top:1px solid var(--border)"><span class="status ${done ? 'done' : ''}" style="width:24px;height:24px">${done ? IC.check : ''}</span><div class="grow">${label}</div>${done ? '' : ctrl}</div>`;
  const lw = latestWeight();
  return `<div class="card" id="wkCard"><div class="card-head"><div class="ic">${IC.calendar}</div><div class="grow"><h3>Weekly check</h3><div class="muted small">About 2 minutes, once a week</div></div></div>
    ${row(weighed, 'Weigh-in <span class="small muted">(morning, before eating)</span>', `<input type="number" inputmode="decimal" step="0.1" id="wkLb" placeholder="${lw ? lw.lb : 'lb'}" style="width:86px;min-height:38px;padding:6px 8px"><button class="btn sm" data-act="wkWeigh">Save</button>`)}
    ${row(checked, 'Progress, repeat or ease off next week', `<button class="btn sm primary" data-act="progCheck">Start</button>`)}
    ${row(backed, 'Back up your data', `<button class="btn sm" data-act="settings">Back up</button>`)}
    <div class="small muted" style="padding-top:8px;border-top:1px solid var(--border)">Optional: <button class="linkbtn" data-act="coachOpen">AI review</button> · <button class="linkbtn" data-act="goto" data-tab="progress" data-sub="review">Week summary</button></div></div>`;
}
ACT.wkWeigh = () => { const lb = num(($('#wkLb') || {}).value); if (lb == null || lb < 80 || lb > 500) return toast('Enter your weight in lb'); S.weights.push({ id: uid(), date: today(), lb, notes: '' }); commit(); toast('Weigh-in saved'); };
ACT.todayMore = () => { ui.todayMore = !ui.todayMore; render(true); };
CHG.rehabTick = el => { const d = el.dataset.date; S.rehab[d] = S.rehab[d] || {}; if (el.checked) S.rehab[d][el.dataset.ex] = true; else delete S.rehab[d][el.dataset.ex]; commit(); };

      <details class="more"><summary>Why? (rules used)</summary><ul class="reasons">${r.reasons.map(x => `<li><span class="dot ${x.lvl}"></span>${esc(x.t)}</li>`).join('')}</ul>

    <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="rdSave">Get recommendation</button>${r ? '<button class="btn" data-act="rdCancel">Cancel</button>' : ''}</div></div>`;

ACT.rdSave = () => {

CHG.heat = el => { const d = el.dataset.date; if (el.checked) S.heat[d] = true; else delete S.heat[d]; commit(); };

/* ================= TRAINING ================= */
function vTrain() {
  let h = `<div class="page-head row between"><h2>Training</h2><button class="btn sm" data-act="coachOpen">${IC.bolt} Coach</button></div><div class="seg" style="margin-bottom:12px"><button class="${ui.trainView === 'week' ? 'on' : ''}" data-act="trainView" data-v="week">Week plan</button><button class="${ui.trainView === 'program' ? 'on' : ''}" data-act="trainView" data-v="program">8-week program</button><button class="${ui.trainView === 'lib' ? 'on' : ''}" data-act="trainView" data-v="lib">Library</button></div>`;
  if (ui.trainView === 'lib') return h + vLibrary();
  if (ui.trainView === 'program') return h + vProgram();
  const sel = ui.trainDate, mon = mondayOf(sel), t = today();
  h += `<div class="row between" style="margin-bottom:8px"><button class="iconbtn" data-act="wkNav" data-d="-7" aria-label="Previous week">${IC.back}</button><div style="text-align:center"><b>${fmtD(mon)} – ${fmtD(addDays(mon, 6))}</b><div class="muted small">${mon === mondayOf(t) ? 'This week' : ''}</div></div><button class="iconbtn" data-act="wkNav" data-d="7" aria-label="Next week">${IC.chev}</button></div>`;
  h += `<div class="week">${PROGRAM.DAYS.map((dk, k) => {
    const d = addDays(mon, k), p = PROGRAM.T[dk], prog = dayProgress(d);
    const pip = sessionDone(d) ? 'done' : prog.done ? 'part' : '';
    return `<button class="wd ${d === sel ? 'sel' : ''} ${d === t ? 'today' : ''}" data-act="selDay" data-d="${d}"><div class="n">${PROGRAM.DAY_NAMES[dk].slice(0, 3)}</div><div class="dt">${parseD(d).getDate()}</div><div class="ty">${p.short}</div><div class="pip ${pip}"></div></button>`;
  }).join('')}</div>`;
  h += vDay(sel);
  return h;
}
ACT.trainView = el => { ui.trainView = el.dataset.v; render(); };
ACT.wkNav = el => { ui.trainDate = addDays(ui.trainDate, Number(el.dataset.d)); render(true); };
ACT.selDay = el => { ui.trainDate = el.dataset.d; render(true); };

function vDay(date) {
  const pl = planFor(date), lvl = effLevel(date), w = S.workouts[date];
  let h = `<div class="card"><div class="row between"><div class="grow"><div class="muted small" style="font-weight:650">${fmtDL(date)} · Week ${w && w.week ? w.week : S.program.week} · ${PROGRAM.PHASES[pl.phase].name}</div><h3 style="margin-top:2px">${pl.title}</h3></div>${pl.type !== 'rest' ? ring(dayProgress(date).pct, Math.round(dayProgress(date).pct * 100) + '%') : ''}</div>
    <ul class="bul small muted" style="margin-top:8px">${pl.purpose.map(p => `<li>${p}</li>`).join('')}</ul><p class="small">${pl.note}</p></div>`;
  if (lvl && pl.type !== 'rest') h += `<div class="ready ${lvl}" style="padding:12px 14px"><div class="lvl">READINESS: ${lvl.toUpperCase()}${S.readiness[date].override ? ' (override)' : ''}</div><div class="small" style="margin-top:3px">${PROGRAM.READY_TEXT[lvl].d}</div></div>`;
  else if (date === today() && pl.type !== 'rest') h += notice('info', `No readiness check-in yet today. <button class="linkbtn" data-act="goto" data-tab="today">Check in</button>`);
  if (S.program.deload && isCurrentOrFuture(date) && pl.type === 'train') h += notice('info', '<b>Lighter (deload) week</b> active: one fewer set and fewer jumps are shown.');
  h += `<div class="list">`;
  pl.items.forEach(it => {
    if (it.ex === 'REHAB') {
      const st = itemStatus(date, it);
      h += `<div class="li tap" data-act="goto" data-tab="elbow"><div class="thumb">${IC.elbow}</div><div class="grow"><div class="t">Prescribed elbow rehab</div><div class="s">4 exercises · ${rehabCount(date)}/4 done · open Elbow Rehab</div></div>${st === 'done' ? `<span class="status done">${IC.check}</span>` : `<span class="chev">${IC.chev}</span>`}</div>`;
      return;
    }
    const ex = EX.byId[it.ex], rx = rxOf(date, it, pl), st = itemStatus(date, it);
    const r = exRec(date, it.ex);
    const tgl = COACH.target(it.ex);
    const sub = (ex.log === 'cardio' || it.sets === 1 ? rx.reps : `${rx.sets} × ${rx.reps}`) + (tgl != null ? ` · ${tgl} lb` : '');
    h += `<div class="li tap" data-act="exOpen" data-ex="${it.ex}" data-date="${date}"><div class="thumb">${thumb(ex)}</div><div class="grow"><div class="t">${ex.name}${it.optional ? ' <span class="chip">optional</span>' : ''}</div><div class="s">${sub}${rx.rest ? ` · rest ${fmtRest(rx.rest)}` : ''}${rx.custom ? ' · <span class="acc">edited</span>' : ''}</div>${rx.adj ? `<div class="s" style="color:var(--${lvl === 'red' ? 'red' : 'yellow'})">${rx.adj}</div>` : ''}${r && r.status === 'skipped' ? `<div class="s">Skipped: ${esc(r.reason || '')}</div>` : ''}</div>${statusBtn(st, 'exQuick', `data-ex="${it.ex}" data-date="${date}"`)}</div>`;
  });
  h += `</div>`;
  if (pl.type === 'game') {
    const g = S.games.find(x => x.date === date);
    h += g ? `<div class="card tight"><div class="row between"><div><b>Game logged</b><div class="small muted">${g.duration || '—'} min · energy ${g.energy}/5 · RPE ${g.rpe}/10 · ${g.points ?? 0} pts</div></div><button class="btn sm" data-act="gameForm" data-id="${g.id}">Edit</button></div></div>`
      : `<button class="btn primary block" data-act="gameForm" data-date="${date}">${IC.ball} Log game</button>`;
  }
  if (pl.type !== 'rest') {
    const done = !!(w && w.completed);
    h += `<button class="btn block ${done ? 'ok' : 'primary'}" style="margin-top:10px" data-act="sessionToggle" data-date="${date}">${done ? IC.check + ' Session complete — tap to undo' : 'Mark session complete'}</button>`;
  }
  h += `<label class="f">Session notes</label><textarea data-chg="sessNote" data-date="${date}" placeholder="How did it feel? Anything to adjust next time?">${esc(w ? w.notes : '')}</textarea>`;
  return h;
}
const fmtRest = s => (s >= 60 ? `${Math.floor(s / 60)}:${pad2(s % 60)}` : `${s}s`);
function thumb(ex) {
  const fr = ex.frames[ex.frames.length > 1 ? 1 : 0];
  return FIG.render([Object.assign({}, fr, { label: '' })]).replace('class="fig"', 'class="fig" preserveAspectRatio="xMidYMid meet"');
}
ACT.sessionToggle = el => {
  const d = el.dataset.date, w = W(d, true); w.completed = !w.completed; w.completedAt = w.completed ? new Date().toISOString() : null;
  commit(); if (w.completed) toast('Session marked complete');
};
CHG.sessNote = el => { W(el.dataset.date, true).notes = el.value; save(); };
ACT.exQuick = (el, e) => {
  e.stopPropagation();
  const d = el.dataset.date, id = el.dataset.ex;
  if (id === 'game') return ACT.gameForm(el);
  const r = exRec(d, id, true);
  if (r.status) { delete r.status; delete r.reason; COACH.clearEval(d, id); } else { r.status = 'done'; COACH.onDone(d, id); }
  autoComplete(d); commit();
};
function autoComplete(d) {
  const p = dayProgress(d), w = W(d, true);
  if (p.total && p.done === p.total && !w.completed) { w.completed = true; w.completedAt = new Date().toISOString(); toast('All exercises done — session complete 🎉'); }
}

/* ---------- exercise sheet ---------- */
ACT.exOpen = el => { ui.editRx = false; ui.skipFor = null; const id = el.dataset.ex, d = el.dataset.date || null; openSheet(EX.byId[id].name, () => exSheetHTML(id, d), { onClose: releaseWake }); if (d) keepAwake(); };
/* keep the screen on while a workout exercise is open (where the browser supports it) */

function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) { } wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && SHEET && $('#sheetBody .setrow, #sheetBody [data-act=exStatus]')) keepAwake(); });

}

  let h = `<div class="row wrap" style="gap:6px"><span class="chip ${ex.cat === 'rehab-add' ? 'red' : ex.cat === 'rehab' ? 'green' : 'acc'}">${EX.CAT_LABEL[ex.cat]}</span>${date ? `<span class="chip">${fmtDL(date)}</span>` : ''}</div>`;
  if (ex.cat === 'rehab-add') h += `<div class="banner-approval" style="margin-top:10px">ADDITIONAL EXERCISES — ONLY PERFORM AFTER APPROVAL FROM MY PHYSIOTHERAPIST.</div>`;
  if (rx && !ui.editRx) {

const sortedElbow = () => Object.keys(S.elbow).sort().map(d => Object.assign({ date: d }, S.elbow[d]));
function elbowAdvice() {
  const e = sortedElbow(); if (!e.length) return null;
  const t = today();
  const recentNew = e.filter(x => x.newSymptoms && daysBetween(x.date, t) <= 14);
  if (recentNew.length) return { lvl: 'danger', short: 'Elbow: new weakness / numbness / loss of function recorded — arrange reassessment with a healthcare professional.', long: `On ${fmtD(recentNew[recentNew.length - 1].date)} you recorded new weakness, numbness, tingling or loss of function. Please arrange a reassessment with a healthcare professional promptly, and avoid loading the elbow until you have been seen.` };
  const daily = e.filter(x => x.daily != null);
  const msgs = [];
  if (daily.length >= 6) {
    const a = avg(daily.slice(-3).map(x => x.daily)), b = avg(daily.slice(-6, -3).map(x => x.daily));
    if (a - b >= 1.5) msgs.push(`daily pain is trending up (last 3 entries avg ${r1(a)} vs ${r1(b)} before)`);
  }
  const last7 = daily.filter(x => daysBetween(x.date, t) <= 7);
  if (last7.length >= 5 && last7.filter(x => x.daily >= 4).length >= 5) msgs.push('pain has been 4/10 or higher on most days this week');
  const last3 = e.slice(-3);
  if (last3.filter(x => x.morningWorse).length >= 2) msgs.push('symptoms were worse the next morning on 2 of your last 3 entries');
  const last = e[e.length - 1];
  if (last && last.during >= 4 && daysBetween(last.date, t) <= 2) msgs.push(`exercise discomfort reached ${last.during}/10 — your program says keep it below 4/10, so reduce effort or repetitions`);
  if (!msgs.length) return null;
  return { lvl: 'warn', short: 'Elbow: ' + msgs[0] + '.', long: `Your log shows that ${msgs.join('; ')}. Consider easing upper-body loading. If symptoms are worsening or persistent, arrange a reassessment with your physiotherapist or another healthcare professional.` };
}

function dunkCalc() {

  return { reach, need, appr, stand, gap: need != null && appr != null ? need - appr : null, aTouch: reach != null && appr != null ? reach + appr : null, sTouch: reach != null && stand != null ? reach + stand : null, lj };
}

  // progression

  h += `<div class="card flat tight small"><b>Plyometric safety rules</b><ul class="bul"><li>Keep jump volume low, especially early on.</li><li>Rest ~60–120 s between demanding jump sets.</li><li>Stop when jump height, landing quality or coordination drops.</li><li>Avoid frequent maximal jump testing (≈ every 4 weeks).</li><li>No demanding jumping on heavily fatigued legs (check readiness).</li><li>At ~210 lb, each landing loads your calves, Achilles, patellar tendons and knees heavily — progress gradually and favour soft surfaces.</li><li>No ball gripping, rim hanging or elbow-stressing activities until you have clinical clearance.</li></ul></div>`;
  STAGES.forEach(st => {
    const unlocked = st.n === 1 || S.plyo.unlocked[st.n];
    const prev = STAGES[st.n - 2];
    h += `<div class="card ${unlocked ? '' : 'flat'}"><div class="row between"><div><div class="muted small" style="font-weight:700">STAGE ${st.n}</div><h3>${st.name}</h3></div>${unlocked ? '<span class="chip green">Unlocked</span>' : `<span class="chip">${IC.lock.replace('<svg', '<svg style="width:13px;height:13px"')} Locked</span>`}</div><p class="small muted">${st.desc}</p>`;
    if (unlocked) {
      h += `<div class="list" style="margin:8px 0 0">${st.ex.map(id => { const ex = EX.byId[id], log = S.plyo.log[id] || []; const doneToday = log.includes(today()); return `<div class="li"><div class="thumb" data-act="exOpen" data-ex="${id}" style="cursor:pointer">${thumb(ex)}</div><div class="grow" data-act="exOpen" data-ex="${id}" style="cursor:pointer"><div class="t">${ex.name}</div><div class="s">${log.length} session${log.length === 1 ? '' : 's'}${log.length ? ' · last ' + fmtD(log[log.length - 1]) : ''}</div></div>${statusBtn(doneToday ? 'done' : '', 'plyoLog', `data-ex="${id}"`)}</div>`; }).join('')}</div><p class="small faint" style="margin-top:6px">Tap the circle to mark an exercise completed today.</p>`;
    } else if (prev) {
      h += `<div class="small" style="margin-top:6px"><b>To unlock — confirm these from Stage ${prev.n}:</b></div>${prev.crit.map((c, i) => { const k = `${prev.n}-${i}`; return `<label class="check small"><input type="checkbox" data-chg="crit" data-k="${k}" ${S.plyo.criteria[k] ? 'checked' : ''}> ${c}</label>`; }).join('')}
        <button class="btn block ${prev.crit.every((_, i) => S.plyo.criteria[`${prev.n}-${i}`]) ? 'primary' : ''}" style="margin-top:8px" data-act="unlock" data-n="${st.n}" ${S.plyo.unlocked[prev.n] || prev.n === 1 ? '' : 'disabled'}>Unlock stage ${st.n}</button>`;
    }
    h += `</div>`;
  });

}
